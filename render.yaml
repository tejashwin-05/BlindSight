services:
  # ── MCP Server (navigation, weather, news, places) ──────────
  - type: web
    name: blindsight-mcp
    runtime: python
    buildCommand: pip install -r mcp_server/requirements.txt
    startCommand: python -m mcp_server.server --sse --port $PORT
    envVars:
      - key: ORS_API_KEY
        sync: false
      - key: OWM_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false

  # ── WebSocket Server (cloud mode, no camera/ML) ─────────────
  - type: web
    name: blindsight-ws
    runtime: python
    buildCommand: pip install -r server/requirements_cloud.txt -r mcp_server/requirements.txt
    startCommand: python server/main_cloud.py
    envVars:
      - key: PORT
        value: "8765"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: GUARDIAN_PHONE_NUMBER
        sync: false
